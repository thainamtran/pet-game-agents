[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pet-game-agents"
version = "0.1.0"
description = "A multi-agent LangGraph framework that collaboratively designs, codes, illustrates, and tests a pet-raising game."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Tue Tran" }]
keywords = ["agents", "langgraph", "multi-agent", "pet-game", "game-nuoi-thu"]
dependencies = [
    "langgraph>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pet-game-agents = "pet_game_agents.cli:main"

[project.urls]
Repository = "https://github.com/thainamtran/pet-game-agents"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pet_game_agents = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
